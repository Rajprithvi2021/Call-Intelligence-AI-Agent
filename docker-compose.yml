# Local Postgres with pgvector:  docker compose up -d
# then set DATABASE_URL=postgresql://postgres:postgres@localhost:5432/callintel
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: callintel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
